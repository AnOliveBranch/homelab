##

[[deployment]]
name = "Pelagius"
[deployment.config]
server = "vm-docker-01"
image.type = "Build"
image.params.build = "pelagius-build"
redeploy_on_build = true
network = "host"
volumes = """
pelagius-data:/app/data
"""

