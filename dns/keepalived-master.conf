global_defs {
    router_id LVS_MASTER
  
    # Enable IPv6 forwarding for this instance
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_dns {
    script "/etc/keepalived/check_dns.sh"
    interval 3      # run every 3s
    timeout 3       # kill the script if it hangs
    fall 3          # 3 consecutive failures = unhealthy
    rise 2          # 2 consecutive successes = healthy again
}

vrrp_instance VI_DNS_IPv4_1 {
    state MASTER
    interface eth0
    virtual_router_id 60
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass [REDACTED]
    }
    virtual_ipaddress {
        10.3.0.10
    }
    track_script {
        chk_dns
    }
}

vrrp_instance VI_DNS_IPv6_1 {
    state MASTER
    interface eth0
    virtual_router_id 60
    priority 100
    advert_int 1

    mcast_src_ip [HOST IPv6 ADDRESS]

    authentication {
        auth_type PASS
        auth_pass [REDACTED]
    }
    virtual_ipaddress {
        fd67:84d2:d793:0:be24:80cb:903a:b295/64
    }
    track_script {
        chk_dns
    }
}
